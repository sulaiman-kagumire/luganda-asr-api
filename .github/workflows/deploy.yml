name: Deploy Luganda ASR API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kagumire/luganda-asr-api:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_IP }}
          username: inference
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
            docker pull kagumire/luganda-asr-api:latest
            docker stop luganda-asr-api || true
            docker rm luganda-asr-api || true
            docker run -d \
              --name luganda-asr-api \
              --restart unless-stopped \
              --gpus all \
              -p 8011:8000 \
              -e HF_TOKEN=${{ secrets.HF_TOKEN }} \
              kagumire/luganda-asr-api:latest
              